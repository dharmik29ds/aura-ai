<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --ink: #e2e8f0;
      --paper: #040d12;
      --card: rgba(255, 255, 255, 0.05);
      --teal: #10b981;
      --teal-dark: #059669;
      --muted: #94a3b8;
      --line: rgba(52, 211, 153, 0.2);
      --font: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }

    /* 全局 Dark Cyber Emerald Background */
    body {
      background: radial-gradient(circle at top center, #062e26, #040d12) !important;
      color: #e2e8f0 !important;
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.55;
    }

    /* App & Auth Layout Setup */
    .app, #auth, div[id*="auth"], div[class*="auth"], div[class*="login"] {
      background: transparent !important;
      color: #e2e8f0 !important;
    }

    .app {
      max-width: 760px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* Header styling */
    header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title, h1, h2 {
      font-weight: 800;
      background: linear-gradient(135deg, #10b981, #34d399, #3b82f6) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      margin: 0;
    }

    .brand-sub, p, label, span {
      color: #94a3b8 !important;
    }

    /* Form Controls & Inputs Overrides */
    input[type="text"],
    input[type="password"],
    input[type="email"],
    textarea {
      background: rgba(255, 255, 255, 0.07) !important;
      color: #ffffff !important;
      border: 1px solid rgba(52, 211, 153, 0.3) !important;
      border-radius: 12px !important;
      padding: 12px 16px !important;
      outline: none !important;
      font-family: var(--font) !important;
    }

    input:focus, textarea:focus {
      border-color: #10b981 !important;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.3) !important;
    }

    /* Buttons Override */
    button, .btn, input[type="submit"] {
      background: linear-gradient(135deg, #059669, #10b981) !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 12px !important;
      font-weight: 600 !important;
      padding: 12px 20px !important;
      cursor: pointer !important;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3) !important;
      transition: all 0.2s ease !important;
    }

    button:hover, .btn:hover {
      opacity: 0.9 !important;
      transform: translateY(-1px) !important;
    }

    /* Suggestion / Quick Action Buttons */
    .suggest-btn, button.secondary, .chip {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(52, 211, 153, 0.25) !important;
      color: #e2e8f0 !important;
    }

    /* Chat Log Container */
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Chat Messages */
    .msg {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #059669, #10b981) !important;
      color: #fff !important;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .msg.aura {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(52, 211, 153, 0.2) !important;
      border-bottom-left-radius: 4px;
      color: #e2e8f0 !important;
      backdrop-filter: blur(12px);
    }

    .msg.pending { color: var(--muted); }

    /* Image Grid Styling */
    .imgs { align-self: flex-start; max-width: 82%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .imgs img { width: 100%; height: 110px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
  </style>
</head>
<body>

  <div class="app">
    <header>
      <svg width="40" height="40" viewBox="0 0 100 100" fill="none">
        <defs>
          <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981" />
            <stop offset="100%" stop-color="#3B82F6" />
          </linearGradient>
        </defs>
        <rect width="100" height="100" rx="24" fill="#06181B"/>
        <circle cx="50" cy="50" r="30" stroke="url(#auraGrad)" stroke-width="6" stroke-dasharray="140 40"/>
        <circle cx="50" cy="50" r="12" fill="url(#auraGrad)"/>
      </svg>
      <div>
        <h1 class="brand-title">Aura</h1>
      </div>
    </header>

    <div id="log"></div>
  </div>

</body>
</html>
