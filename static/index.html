<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
<style>
  :root {
    --ink: #16213E;
    --paper: #F1F4F8;
    --card: #FFFFFF;
    --teal: #0E7C86;
    --teal-dark: #0A5F67;
    --muted: #5B6577;
    --line: #D9DFE8;
    --danger: #B3261E;
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
  .app { max-width: 760px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }

  header { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  header span { color: var(--muted); font-size: 14px; }

  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 82%; padding: 11px 15px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
  .msg.aura { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.pending { color: var(--muted); }

  .confirm { align-self: flex-start; max-width: 82%; background: var(--card); border: 1px solid var(--danger); border-radius: 12px; padding: 14px 16px; }
  .confirm p { margin: 0 0 12px; }
  .confirm .row { display: flex; gap: 10px; }
  .confirm.done { border-color: var(--line); color: var(--muted); }

  button { font-family: inherit; font-size: 15px; border-radius: 10px; cursor: pointer; padding: 9px 16px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

  .empty { margin: auto 0; }
  .empty h2 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .empty p { margin: 0 0 18px; color: var(--muted); }
  .chips { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .chip { text-align: left; }
  .chip:hover { border-color: var(--teal); }

  form { display: flex; gap: 10px; padding: 14px 20px 20px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; font-family: inherit; font-size: 16px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); max-height: 140px; }
  #send { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 500; padding: 0 22px; }
  #send:hover { background: var(--teal-dark); }
  #send:disabled { opacity: .55; cursor: default; }

  #lock { position: fixed; inset: 0; background: var(--paper); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  #lock[hidden] { display: none; }
  #lockForm { width: 100%; max-width: 340px; }
  #lockForm h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: -0.01em; }
  #lockForm p { margin: 0 0 16px; color: var(--muted); }
  #lockForm input { width: 100%; font-family: inherit; font-size: 16px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); margin-bottom: 12px; }
  #lockForm button { width: 100%; background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 500; }
  #lockErr { margin: 12px 0 0; color: var(--danger); min-height: 1.5em; }

  @media (prefers-reduced-motion: no-preference) { .msg { animation: in .18s ease-out; } @keyframes in { from { opacity: 0; transform: translateY(4px); } } }
</style>
</head>
<body>
<div class="app">
  <header><h1>Aura</h1><span>Notes, reminders, and answers in English, Hindi, or Hinglish</span></header>

  <div id="log" aria-live="polite">
    <div class="empty" id="empty">
      <h2>What can I do for you?</h2>
      <p>Try one of these, or type anything.</p>
      <div class="chips">
        <button class="chip" type="button">Kal subah 7 baje gym ka reminder set karo</button>
        <button class="chip" type="button">Save a note: Ask Priya about the venue booking</button>
        <button class="chip" type="button">Remember that I prefer replies in Hinglish</button>
        <button class="chip" type="button">Show my reminders</button>
      </div>
    </div>
  </div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Message Aura" aria-label="Message Aura"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<div id="lock" hidden>
  <form id="lockForm">
    <h2>Enter passcode</h2>
    <p>This Aura is private.</p>
    <input id="pass" type="password" autocomplete="current-password" aria-label="Passcode">
    <button type="submit">Unlock</button>
    <p id="lockErr" role="alert"></p>
  </form>
</div>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  let history = [];
  const lock = document.getElementById('lock');
  const lockForm = document.getElementById('lockForm');
  const pass = document.getElementById('pass');
  const lockErr = document.getElementById('lockErr');
  let passcode = '';
  try { passcode = sessionStorage.getItem('aura_pass') || ''; } catch (e) {}

  function api(url, opts = {}) {
    opts.headers = Object.assign({}, opts.headers, { 'X-Passcode': passcode });
    return fetch(url, opts);
  }
  function showLock(msg) {
    lock.hidden = false; lockErr.textContent = msg || ''; pass.value = ''; pass.focus();
  }
  lockForm.addEventListener('submit', async e => {
    e.preventDefault();
    passcode = pass.value;
    const r = await api('/login', { method: 'POST' });
    if (r.ok) {
      try { sessionStorage.setItem('aura_pass', passcode); } catch (e) {}
      lock.hidden = true; input.focus();
    } else {
      showLock(r.status === 429 ? 'Too many tries. Wait a minute.' : 'Wrong passcode.');
    }
  });
  (async () => {
    try {
      const c = await (await fetch('/config')).json();
      if (c.passcode_required) {
        const r = await api('/login', { method: 'POST' });
        if (!r.ok) showLock();
      }
    } catch (e) {}
  })();

  function add(text, cls) {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function addConfirm(action) {
    const box = document.createElement('div');
    box.className = 'confirm';
    const p = document.createElement('p');
    p.textContent = 'Please confirm: ' + action.summary;
    const row = document.createElement('div');
    row.className = 'row';
    const yes = document.createElement('button'); yes.className = 'danger'; yes.textContent = 'Confirm delete';
    const no = document.createElement('button'); no.textContent = 'Cancel';
    const finish = (msg) => { box.className = 'confirm done'; box.textContent = msg; };
    yes.onclick = async () => {
      const r = await api('/confirm/' + action.id, { method: 'POST' });
      finish(r.ok ? 'Deleted: ' + action.summary : 'That request expired. Ask Aura again.');
    };
    no.onclick = async () => { await api('/reject/' + action.id, { method: 'POST' }); finish('Cancelled. Nothing was deleted.'); };
    row.append(yes, no);
    box.append(p, row);
    log.appendChild(box);
    log.scrollTop = log.scrollHeight;
  }

  async function sendMessage(text) {
    text = text.trim();
    if (!text) return;
    const empty = document.getElementById('empty');
    if (empty) empty.remove();
    add(text, 'user');
    input.value = ''; input.style.height = 'auto';
    send.disabled = true;
    const wait = add('Thinking…', 'aura pending');
    try {
      const r = await api('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history })
      });
      if (r.status === 401) { showLock('Enter the passcode to continue.'); throw new Error('Passcode needed.'); }
      if (!r.ok) throw new Error('Server error ' + r.status + '. Check the terminal for details.');
      const data = await r.json();
      wait.className = 'msg aura';
      wait.textContent = data.reply;
      history.push({ role: 'user', content: text }, { role: 'assistant', content: data.reply });
      data.pending_actions.forEach(addConfirm);
    } catch (e) {
      wait.className = 'msg aura';
      wait.textContent = 'Could not reach Aura. ' + e.message;
    } finally {
      send.disabled = false; input.focus();
    }
  }

  form.addEventListener('submit', e => { e.preventDefault(); sendMessage(input.value); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(input.value); } });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => sendMessage(c.textContent)));
</script>
</body>
</html>
