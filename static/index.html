<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Ccircle cx=%2720%27 cy=%2720%27 r=%2720%27 fill=%27%232A1A3D%27/%3E%3Ccircle cx=%2720%27 cy=%2720%27 r=%277.5%27 fill=%27%23DD8A2E%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ink: #2A1A3D;          /* deep plum-indigo, warm not cold black */
    --paper: #FAF6EE;        /* warm ivory */
    --card: #FFFFFF;
    --teal: #DD8A2E;         /* marigold -- primary accent, replaces teal name for minimal diff */
    --teal-dark: #B96E1E;
    --muted: #7B6C82;        /* plum-grey */
    --line: #E7DBC9;         /* warm hairline */
    --danger: #B3261E;
    --glow: #F4B860;
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", "Noto Sans Gujarati", sans-serif;
    --font-display: "Fraunces", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(560px 320px at 85% -8%, rgba(244,184,96,0.16), transparent 60%),
      var(--paper);
    color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55;
  }
  .app { max-width: 760px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }

  header { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--card); }
  header .brand { display: flex; align-items: center; gap: 12px; }
  header .mark { width: 34px; height: 34px; flex: 0 0 auto; }
  header h1 { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 1px; }
  header .who { display: flex; align-items: center; gap: 10px; }
  header .who span { font-size: 14px; color: var(--muted); }
  header button.link { background: none; border: none; color: var(--teal-dark); font-size: 14px; cursor: pointer; padding: 0; font-weight: 500; }

  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 82%; padding: 11px 15px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
  .msg.aura { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.pending { color: var(--muted); }

  .imgs { align-self: flex-start; max-width: 82%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .imgs img { width: 100%; height: 110px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }

  .confirm { align-self: flex-start; max-width: 82%; background: var(--card); border: 1px solid var(--danger); border-radius: 12px; padding: 14px 16px; }
  .confirm p { margin: 0 0 12px; }
  .confirm .row { display: flex; gap: 10px; }
  .confirm.done { border-color: var(--line); color: var(--muted); }

  button { font-family: inherit; font-size: 15px; border-radius: 10px; cursor: pointer; padding: 9px 16px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

  .empty { margin: auto 0; }
  .empty h2 { font-family: var(--font-display); font-weight: 600; font-size: 28px; margin: 0 0 6px; letter-spacing: -0.01em; color: var(--ink); }
  .empty p { margin: 0 0 18px; color: var(--muted); }
  .chips { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .chip { text-align: left; }
  .chip:hover { border-color: var(--teal); }

  form#form { display: flex; gap: 10px; padding: 14px 20px 20px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; font-family: inherit; font-size: 16px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); max-height: 140px; }
  #send { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 500; padding: 0 22px; }
  #send:hover { background: var(--teal-dark); }
  #send { box-shadow: 0 2px 8px rgba(221,138,46,0.35); }
  #send:disabled { opacity: .55; cursor: default; }

  /* auth screen */
  #auth {
    position: fixed; inset: 0; z-index: 10; padding: 20px;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(680px 420px at 50% -10%, rgba(244,184,96,0.22), transparent 62%),
      var(--paper);
  }
  #auth[hidden] { display: none; }
  .authbox { width: 100%; max-width: 360px; text-align: center; }
  .authbox .mark { width: 56px; height: 56px; margin: 0 auto 18px; display: block; }
  .authbox input { text-align: left; }
  .authbox h2 { font-family: var(--font-display); font-weight: 600; font-size: 30px; margin: 0 0 6px; letter-spacing: -0.01em; color: var(--ink); }
  .authbox p.sub { margin: 0 0 20px; color: var(--muted); }
  .authbox input { width: 100%; font-family: inherit; font-size: 16px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); margin-bottom: 10px; }
  .authbox button[type="submit"] { width: 100%; background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 500; padding: 11px; margin-top: 4px; }
  .authbox .switch { margin-top: 16px; font-size: 14px; color: var(--muted); text-align: center; }
  .authbox .switch button { background: none; border: none; color: var(--teal); cursor: pointer; padding: 0; font: inherit; }
  .autherr { margin: 10px 0 0; color: var(--danger); font-size: 14px; min-height: 1.4em; }


  form#form { align-items: flex-end; }
  #attachBtn { width: 44px; height: 44px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 20px; padding: 0; }
  #filePreview { display: none; align-items: center; gap: 10px; padding: 10px 20px; border-top: 1px solid var(--line); background: var(--card); }
  #filePreview.show { display: flex; }
  #filePreview img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  #filePreview span { flex: 1; font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #filePreview button { padding: 4px 10px; font-size: 13px; }


  #filePreview button#fileEdit { background: var(--teal); border-color: var(--teal); color: #fff; }

  #editModal { position: fixed; inset: 0; background: rgba(42,26,61,0.55); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  #editModal.show { display: flex; }
  .editbox { background: var(--card); border-radius: 16px; padding: 18px; max-width: 480px; width: 100%; max-height: 92vh; overflow-y: auto; }
  .editbox h3 { margin: 0 0 12px; font-family: var(--font-display); font-size: 20px; }
  #editCanvasWrap { position: relative; width: 100%; background: #00000010; border-radius: 10px; overflow: hidden; margin-bottom: 14px; touch-action: none; }
  #editCanvas { width: 100%; display: block; }
  #cropOverlay { position: absolute; border: 2px dashed var(--teal); background: rgba(221,138,46,0.12); display: none; }
  .editRow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .editRow label { width: 84px; font-size: 13px; color: var(--muted); flex: 0 0 auto; }
  .editRow input[type="range"] { flex: 1; }
  .editRow select { flex: 1; font-family: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
  .editActions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .editActions button { font-size: 13px; padding: 7px 12px; }
  .editFooter { display: flex; gap: 10px; justify-content: flex-end; }
  .editFooter button.primary { background: var(--teal); border-color: var(--teal); color: #fff; }


  #micBtn { width: 44px; height: 44px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 18px; padding: 0; }
  #micBtn.listening { background: var(--danger); border-color: var(--danger); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(179,38,30,0.4); } 50% { box-shadow: 0 0 0 8px rgba(179,38,30,0); } }

  @media (prefers-reduced-motion: no-preference) { .msg { animation: in .18s ease-out; } @keyframes in { from { opacity: 0; transform: translateY(4px); } } }
</style>
</head>
<body>

<div id="auth">
  <div class="authbox">
    <div class="mark"><svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aura">
  <circle cx="20" cy="20" r="20" fill="#2A1A3D"/>
  <g fill="none" stroke="#F4B860" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M20 6 L20 10.5"/>
    <path d="M20 29.5 L20 34"/>
    <path d="M6 20 L10.5 20"/>
    <path d="M29.5 20 L34 20"/>
    <path d="M10.2 10.2 L13.3 13.3"/>
    <path d="M26.7 26.7 L29.8 29.8"/>
    <path d="M10.2 29.8 L13.3 26.7"/>
    <path d="M26.7 13.3 L29.8 10.2"/>
  </g>
  <circle cx="20" cy="20" r="7.5" fill="#DD8A2E"/>
  <circle cx="20" cy="20" r="7.5" fill="url(#auraGlow)"/>
  <defs>
    <radialGradient id="auraGlow" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#F4B860"/>
      <stop offset="100%" stop-color="#DD8A2E"/>
    </radialGradient>
  </defs>
</svg></div>
    <h2 id="authTitle">Welcome to Aura</h2>
    <p class="sub" id="authSub">Log in to your account.</p>
    <form id="authForm">
      <input id="authName" type="text" placeholder="Your name" autocomplete="name" hidden>
      <input id="authEmail" type="email" placeholder="Email" autocomplete="email" required>
      <input id="authPass" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" id="authSubmit">Log in</button>
      <p class="autherr" id="authErr" role="alert"></p>
    </form>
    <div class="switch">
      <span id="switchText">New here?</span> <button type="button" id="switchBtn">Create an account</button>
    </div>
  </div>
</div>

<div class="app">
  <header>
    <div class="brand"><div class="mark"><svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aura">
  <circle cx="20" cy="20" r="20" fill="#2A1A3D"/>
  <g fill="none" stroke="#F4B860" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M20 6 L20 10.5"/>
    <path d="M20 29.5 L20 34"/>
    <path d="M6 20 L10.5 20"/>
    <path d="M29.5 20 L34 20"/>
    <path d="M10.2 10.2 L13.3 13.3"/>
    <path d="M26.7 26.7 L29.8 29.8"/>
    <path d="M10.2 29.8 L13.3 26.7"/>
    <path d="M26.7 13.3 L29.8 10.2"/>
  </g>
  <circle cx="20" cy="20" r="7.5" fill="#DD8A2E"/>
  <circle cx="20" cy="20" r="7.5" fill="url(#auraGlow)"/>
  <defs>
    <radialGradient id="auraGlow" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#F4B860"/>
      <stop offset="100%" stop-color="#DD8A2E"/>
    </radialGradient>
  </defs>
</svg></div><div><h1>Aura</h1><div class="sub">Notes, reminders, and answers in English, Hindi, or Hinglish</div></div></div>
    <div class="who"><span id="whoami"></span><button class="link" id="logoutBtn" hidden>Log out</button></div>
  </header>

  <div id="log" aria-live="polite">
    <div class="empty" id="empty">
      <h2>What can I do for you?</h2>
      <p>Try one of these, or type anything.</p>
      <div class="chips">
        <button class="chip" type="button">Kal subah 7 baje gym ka reminder set karo</button>
        <button class="chip" type="button">Save a note: Ask Priya about the venue booking</button>
        <button class="chip" type="button">Remember that I prefer replies in Hinglish</button>
        <button class="chip" type="button">Show my reminders</button>
      </div>
    </div>
  </div>

  <div id="filePreview">
    <img id="filePreviewImg" alt="">
    <span id="filePreviewName"></span>
    <button type="button" id="fileEdit">✏️ Edit</button>
    <button type="button" id="fileRemove">Remove</button>
  </div>

  <div id="editModal">
    <div class="editbox">
      <h3>Edit photo</h3>
      <div id="editCanvasWrap">
        <canvas id="editCanvas"></canvas>
        <div id="cropOverlay"></div>
      </div>
      <div class="editActions">
        <button type="button" id="rotateLeft">⟲ Rotate</button>
        <button type="button" id="rotateRight">⟳ Rotate</button>
        <button type="button" id="cropToggle">▭ Crop</button>
        <button type="button" id="cropApply" hidden>Apply crop</button>
        <button type="button" id="resetEdits">Reset</button>
      </div>
      <div class="editRow">
        <label for="brightness">Brightness</label>
        <input type="range" id="brightness" min="-100" max="100" value="0">
      </div>
      <div class="editRow">
        <label for="contrast">Contrast</label>
        <input type="range" id="contrast" min="-100" max="100" value="0">
      </div>
      <div class="editRow">
        <label for="filterSelect">Filter</label>
        <select id="filterSelect">
          <option value="none">None</option>
          <option value="bw">Black &amp; white</option>
          <option value="sepia">Sepia</option>
          <option value="vintage">Vintage</option>
        </select>
      </div>
      <div class="editFooter">
        <button type="button" id="editDownload">⬇ Download</button>
        <button type="button" id="editCancel">Cancel</button>
        <button type="button" id="editSave" class="primary">Save</button>
      </div>
    </div>
  </div>
  <form id="form">
    <input type="file" id="fileInput" accept="image/*" hidden>
    <button type="button" id="attachBtn" title="Attach a photo" aria-label="Attach a photo">📎</button>
    <button type="button" id="micBtn" title="Speak your message" aria-label="Speak your message" hidden>🎤</button>
    <textarea id="input" rows="1" placeholder="Message Aura" aria-label="Message Aura"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  let history = [];
  let pendingFile = null; // { base64, mime, name }

  const fileInput = document.getElementById('fileInput');
  const attachBtn = document.getElementById('attachBtn');
  const filePreview = document.getElementById('filePreview');
  const filePreviewImg = document.getElementById('filePreviewImg');
  const filePreviewName = document.getElementById('filePreviewName');
  const fileRemove = document.getElementById('fileRemove');

  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (!f) return;
    if (!f.type.startsWith('image/')) { alert('Please choose an image file.'); return; }
    if (f.size > 8 * 1024 * 1024) { alert('That image is too large (max 8MB).'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result; // "data:image/jpeg;base64,...."
      const base64 = dataUrl.split(',')[1];
      pendingFile = { base64, mime: f.type, name: f.name };
      filePreviewImg.src = dataUrl;
      filePreviewName.textContent = f.name;
      filePreview.classList.add('show');
    };
    reader.readAsDataURL(f);
  });
  fileRemove.addEventListener('click', () => {
    pendingFile = null;
    fileInput.value = '';
    filePreview.classList.remove('show');
  });
  let config = null;
  let session = null; // { access_token, user: {id, email, user_metadata} }

  try { const saved = sessionStorage.getItem('aura_session'); if (saved) session = JSON.parse(saved); } catch (e) {}

  const authEl = document.getElementById('auth');
  const authForm = document.getElementById('authForm');
  const authTitle = document.getElementById('authTitle');
  const authSub = document.getElementById('authSub');
  const authName = document.getElementById('authName');
  const authEmail = document.getElementById('authEmail');
  const authPass = document.getElementById('authPass');
  const authSubmit = document.getElementById('authSubmit');
  const authErr = document.getElementById('authErr');
  const switchText = document.getElementById('switchText');
  const switchBtn = document.getElementById('switchBtn');
  const whoami = document.getElementById('whoami');
  const logoutBtn = document.getElementById('logoutBtn');
  let mode = 'login'; // or 'signup'

  function setMode(m) {
    mode = m;
    if (m === 'signup') {
      authTitle.textContent = 'Create your account';
      authSub.textContent = 'Aura will remember your name and keep your notes private to you.';
      authName.hidden = false;
      authSubmit.textContent = 'Create account';
      switchText.textContent = 'Already have an account?';
      switchBtn.textContent = 'Log in';
    } else {
      authTitle.textContent = 'Welcome to Aura';
      authSub.textContent = 'Log in to your account.';
      authName.hidden = true;
      authSubmit.textContent = 'Log in';
      switchText.textContent = 'New here?';
      switchBtn.textContent = 'Create an account';
    }
    authErr.textContent = '';
  }
  switchBtn.addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));

  async function api(url, opts = {}) {
    opts.headers = Object.assign({}, opts.headers, session ? { 'Authorization': 'Bearer ' + session.access_token } : {});
    const r = await fetch(url, opts);
    if (r.status === 401) { showAuth(); }
    return r;
  }

  function showAuth() {
    session = null;
    try { sessionStorage.removeItem('aura_session'); } catch (e) {}
    authEl.hidden = false;
    logoutBtn.hidden = true;
    whoami.textContent = '';
  }

  function showApp() {
    authEl.hidden = true;
    logoutBtn.hidden = false;
    whoami.textContent = (session.user.user_metadata && session.user.user_metadata.full_name) || session.user.email || '';
    input.focus();
  }

  authForm.addEventListener('submit', async e => {
    e.preventDefault();
    authErr.textContent = '';
    authSubmit.disabled = true;
    try {
      if (!config) config = await (await fetch('/config')).json();
      const base = config.supabase_url + '/auth/v1';
      const headers = { 'Content-Type': 'application/json', 'apikey': config.supabase_anon_key };
      if (mode === 'signup') {
        const body = { email: authEmail.value, password: authPass.value, data: { full_name: authName.value || undefined } };
        const r = await fetch(base + '/signup', { method: 'POST', headers, body: JSON.stringify(body) });
        const data = await r.json();
        if (!r.ok) throw new Error(data.msg || data.error_description || 'Could not create account.');
        if (data.access_token) {
          session = { access_token: data.access_token, user: data.user };
        } else {
          authErr.textContent = 'Account created. Check your email to confirm, then log in.';
          setMode('login');
          authSubmit.disabled = false;
          return;
        }
      } else {
        const r = await fetch(base + '/token?grant_type=password', {
          method: 'POST', headers, body: JSON.stringify({ email: authEmail.value, password: authPass.value })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error_description || data.msg || 'Wrong email or password.');
        session = { access_token: data.access_token, user: data.user };
      }
      try { sessionStorage.setItem('aura_session', JSON.stringify(session)); } catch (e) {}
      showApp();
    } catch (err) {
      authErr.textContent = err.message;
    } finally {
      authSubmit.disabled = false;
    }
  });

  logoutBtn.addEventListener('click', () => { showAuth(); setMode('login'); });

  (async () => {
    if (session) {
      const r = await api('/me');
      if (r.ok) { showApp(); } else { showAuth(); }
    } else {
      showAuth();
    }
  })();


  // ---------------- Photo editor (crop, rotate, brightness/contrast, filters) ----------------
  const editModal = document.getElementById('editModal');
  const editCanvas = document.getElementById('editCanvas');
  const editCtx = editCanvas.getContext('2d');
  const cropOverlay = document.getElementById('cropOverlay');
  const canvasWrap = document.getElementById('editCanvasWrap');
  const brightnessInput = document.getElementById('brightness');
  const contrastInput = document.getElementById('contrast');
  const filterSelect = document.getElementById('filterSelect');
  let baseImg = null;       // the ORIGINAL image (for reset)
  let workingImg = null;    // current image after crop/rotate (adjustments applied on top, non-destructively)
  let rotationDeg = 0;
  let cropping = false;
  let cropStart = null;

  function loadImageEl(dataUrl) {
    return new Promise(resolve => { const im = new Image(); im.onload = () => resolve(im); im.src = dataUrl; });
  }

  function filterCss() {
    const b = 1 + (parseInt(brightnessInput.value, 10) / 100);
    const c = 1 + (parseInt(contrastInput.value, 10) / 100);
    let f = `brightness(${b}) contrast(${c})`;
    if (filterSelect.value === 'bw') f += ' grayscale(1)';
    if (filterSelect.value === 'sepia') f += ' sepia(0.85)';
    if (filterSelect.value === 'vintage') f += ' sepia(0.35) saturate(1.3) contrast(1.05)';
    return f;
  }

  function renderCanvas() {
    if (!workingImg) return;
    const rot = ((rotationDeg % 360) + 360) % 360;
    const swap = rot === 90 || rot === 270;
    const w = swap ? workingImg.height : workingImg.width;
    const h = swap ? workingImg.width : workingImg.height;
    editCanvas.width = w; editCanvas.height = h;
    editCtx.save();
    editCtx.filter = filterCss();
    editCtx.translate(w / 2, h / 2);
    editCtx.rotate(rot * Math.PI / 180);
    editCtx.drawImage(workingImg, -workingImg.width / 2, -workingImg.height / 2);
    editCtx.restore();
  }

  async function openEditor() {
    if (!pendingFile) return;
    const dataUrl = `data:${pendingFile.mime};base64,${pendingFile.base64}`;
    baseImg = await loadImageEl(dataUrl);
    workingImg = baseImg;
    rotationDeg = 0;
    brightnessInput.value = 0; contrastInput.value = 0; filterSelect.value = 'none';
    cropping = false; cropOverlay.style.display = 'none';
    document.getElementById('cropApply').hidden = true;
    renderCanvas();
    editModal.classList.add('show');
  }

  document.getElementById('fileEdit').addEventListener('click', openEditor);
  document.getElementById('editCancel').addEventListener('click', () => editModal.classList.remove('show'));

  document.getElementById('rotateLeft').addEventListener('click', () => { rotationDeg -= 90; renderCanvas(); });
  document.getElementById('rotateRight').addEventListener('click', () => { rotationDeg += 90; renderCanvas(); });
  document.getElementById('resetEdits').addEventListener('click', () => {
    workingImg = baseImg; rotationDeg = 0;
    brightnessInput.value = 0; contrastInput.value = 0; filterSelect.value = 'none';
    cropping = false; cropOverlay.style.display = 'none';
    document.getElementById('cropApply').hidden = true;
    renderCanvas();
  });
  [brightnessInput, contrastInput, filterSelect].forEach(el => el.addEventListener('input', renderCanvas));

  const cropToggle = document.getElementById('cropToggle');
  const cropApplyBtn = document.getElementById('cropApply');
  cropToggle.addEventListener('click', () => {
    cropping = !cropping;
    cropOverlay.style.display = 'none';
    cropApplyBtn.hidden = !cropping;
  });

  function pointerPos(e) {
    const r = editCanvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: Math.max(0, Math.min(r.width, cx)), y: Math.max(0, Math.min(r.height, cy)) };
  }
  canvasWrap.addEventListener('pointerdown', e => {
    if (!cropping) return;
    cropStart = pointerPos(e);
    cropOverlay.style.left = cropStart.x + 'px'; cropOverlay.style.top = cropStart.y + 'px';
    cropOverlay.style.width = '0px'; cropOverlay.style.height = '0px';
    cropOverlay.style.display = 'block';
  });
  canvasWrap.addEventListener('pointermove', e => {
    if (!cropping || !cropStart) return;
    const p = pointerPos(e);
    const x = Math.min(cropStart.x, p.x), y = Math.min(cropStart.y, p.y);
    const w = Math.abs(p.x - cropStart.x), h = Math.abs(p.y - cropStart.y);
    cropOverlay.style.left = x + 'px'; cropOverlay.style.top = y + 'px';
    cropOverlay.style.width = w + 'px'; cropOverlay.style.height = h + 'px';
  });
  canvasWrap.addEventListener('pointerup', () => { cropStart = null; });

  cropApplyBtn.addEventListener('click', () => {
    const wrapRect = editCanvas.getBoundingClientRect();
    const scaleX = editCanvas.width / wrapRect.width;
    const scaleY = editCanvas.height / wrapRect.height;
    const ox = parseFloat(cropOverlay.style.left) || 0;
    const oy = parseFloat(cropOverlay.style.top) || 0;
    const ow = parseFloat(cropOverlay.style.width) || 0;
    const oh = parseFloat(cropOverlay.style.height) || 0;
    if (ow < 4 || oh < 4) return;
    const sx = ox * scaleX, sy = oy * scaleY, sw = ow * scaleX, sh = oh * scaleY;
    const cropped = document.createElement('canvas');
    cropped.width = sw; cropped.height = sh;
    cropped.getContext('2d').drawImage(editCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
    const newImg = new Image();
    newImg.onload = () => {
      workingImg = newImg; rotationDeg = 0;
      cropping = false; cropOverlay.style.display = 'none'; cropApplyBtn.hidden = true;
      renderCanvas();
    };
    newImg.src = cropped.toDataURL('image/png');
  });

  document.getElementById('editDownload').addEventListener('click', () => {
    renderCanvas();
    const dataUrl = editCanvas.toDataURL('image/jpeg', 0.92);
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = ((pendingFile && pendingFile.name) || 'aura-edit').replace(/\.[^.]+$/, '') + '-edited.jpg';
    document.body.appendChild(a); a.click(); a.remove();
  });

  document.getElementById('editSave').addEventListener('click', () => {
    renderCanvas();
    const dataUrl = editCanvas.toDataURL('image/jpeg', 0.9);
    const base64 = dataUrl.split(',')[1];
    pendingFile = { base64, mime: 'image/jpeg', name: (pendingFile && pendingFile.name) || 'edited.jpg' };
    filePreviewImg.src = dataUrl;
    editModal.classList.remove('show');
  });


  // ---------------- Voice input (browser speech recognition, free, no backend) ----------------
  const micBtn = document.getElementById('micBtn');
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null, listening = false;
  if (SpeechRec) {
    micBtn.hidden = false;
    recognizer = new SpeechRec();
    recognizer.continuous = false;
    recognizer.interimResults = false;
    recognizer.lang = 'en-IN'; // works well for English/Hinglish speech; change to 'hi-IN' for Hindi
    recognizer.onresult = (e) => {
      const text = e.results[0][0].transcript;
      input.value = (input.value ? input.value + ' ' : '') + text;
      input.dispatchEvent(new Event('input'));
      input.focus();
    };
    recognizer.onerror = () => { listening = false; micBtn.classList.remove('listening'); };
    recognizer.onend = () => { listening = false; micBtn.classList.remove('listening'); };
    micBtn.addEventListener('click', () => {
      if (listening) { recognizer.stop(); return; }
      try { recognizer.start(); listening = true; micBtn.classList.add('listening'); }
      catch (e) {}
    });
  }

  function add(text, cls) {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function addImages(images) {
    if (!images || !images.length) return;
    const grid = document.createElement('div');
    grid.className = 'imgs';
    images.forEach(im => {
      const img = document.createElement('img');
      img.src = im.image_url;
      img.alt = im.title || '';
      img.loading = 'lazy';
      img.onerror = () => img.remove();
      grid.appendChild(img);
    });
    log.appendChild(grid);
    log.scrollTop = log.scrollHeight;
  }

  function addConfirm(action) {
    const box = document.createElement('div');
    box.className = 'confirm';
    const p = document.createElement('p');
    p.textContent = 'Please confirm: ' + action.summary;
    const row = document.createElement('div');
    row.className = 'row';
    const yes = document.createElement('button'); yes.className = 'danger'; yes.textContent = 'Confirm delete';
    const no = document.createElement('button'); no.textContent = 'Cancel';
    const finish = (msg) => { box.className = 'confirm done'; box.textContent = msg; };
    yes.onclick = async () => {
      const r = await api('/confirm/' + action.id, { method: 'POST' });
      finish(r.ok ? 'Deleted: ' + action.summary : 'That request expired. Ask Aura again.');
    };
    no.onclick = async () => { await api('/reject/' + action.id, { method: 'POST' }); finish('Cancelled. Nothing was deleted.'); };
    row.append(yes, no);
    box.append(p, row);
    log.appendChild(box);
    log.scrollTop = log.scrollHeight;
  }

  async function sendMessage(text) {
    text = text.trim();
    if (!text && !pendingFile) return;
    const empty = document.getElementById('empty');
    if (empty) empty.remove();
    if (pendingFile) add((text || '(photo)') + '  📎 ' + pendingFile.name, 'user');
    else add(text, 'user');
    const fileToSend = pendingFile;
    input.value = ''; input.style.height = 'auto';
    fileInput.value = ''; pendingFile = null; filePreview.classList.remove('show');
    send.disabled = true;
    const wait = add('Thinking…', 'aura pending');
    try {
      const body = { message: text, history };
      if (fileToSend) { body.image_base64 = fileToSend.base64; body.image_mime = fileToSend.mime; }
      const r = await api('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error('Server error ' + r.status + '. Check the terminal for details.');
      const data = await r.json();
      wait.className = 'msg aura';
      wait.textContent = data.reply;
      if (!fileToSend) history.push({ role: 'user', content: text }, { role: 'assistant', content: data.reply });
      data.pending_actions.forEach(addConfirm);
      addImages(data.images);
    } catch (e) {
      wait.className = 'msg aura';
      wait.textContent = 'Could not reach Aura. ' + e.message;
    } finally {
      send.disabled = false; input.focus();
    }
  }

  form.addEventListener('submit', e => { e.preventDefault(); sendMessage(input.value); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(input.value); } });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => sendMessage(c.textContent)));
</script>
</body>
</html>
