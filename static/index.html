<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --ink: #e2e8f0;
      --paper: #040d12;
      --card: rgba(255, 255, 255, 0.05);
      --teal: #10b981;
      --teal-dark: #059669;
      --muted: #94a3b8;
      --line: rgba(52, 211, 153, 0.2);
      --font: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top center, #062e26, #040d12) !important;
      color: #e2e8f0;
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.55;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      height: 90vh;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--line);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      overflow: hidden;
      margin: 20px;
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(6, 24, 27, 0.4);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #10b981, #34d399, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .logout-btn {
      background: none;
      border: 1px solid var(--line);
      color: var(--teal);
      cursor: pointer;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 8px;
    }

    /* Auth View */
    .auth-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .auth-box h2 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #10b981, #34d399, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-box p { color: var(--muted); margin-bottom: 24px; }

    .auth-form {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-form input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .auth-form input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
    }

    .auth-form button {
      padding: 12px;
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    /* Chat View */
    .chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome-prompt {
      text-align: center;
      margin: auto 0;
      padding: 20px;
    }

    .welcome-prompt h2 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #f1f5f9;
    }

    .welcome-prompt p {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .suggestions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 420px;
      margin: 0 auto;
    }

    .chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 12px;
      color: #cbd5e1;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .chip:hover {
      background: rgba(16, 185, 129, 0.1);
      border-color: var(--teal);
      color: #fff;
    }

    .msg {
      max-width: 82%;
      padding: 12px 18px;
      border-radius: 18px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.6;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #059669, #10b981);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
    }

    .msg.aura {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
      color: #e2e8f0;
      backdrop-filter: blur(12px);
    }

    /* Input Bar */
    .input-bar {
      padding: 16px 24px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 12px;
      background: rgba(6, 24, 27, 0.4);
    }

    .input-bar textarea {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 16px;
      color: #fff;
      font-family: var(--font);
      font-size: 15px;
      resize: none;
      height: 48px;
      outline: none;
    }

    .input-bar textarea:focus {
      border-color: var(--teal);
    }

    .send-btn {
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 0 24px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-brand">
        <svg width="38" height="38" viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#10B981" />
              <stop offset="100%" stop-color="#3B82F6" />
            </linearGradient>
          </defs>
          <rect width="100" height="100" rx="24" fill="#06181B"/>
          <circle cx="50" cy="50" r="30" stroke="url(#auraGrad)" stroke-width="6" stroke-dasharray="140 40"/>
          <circle cx="50" cy="50" r="12" fill="url(#auraGrad)"/>
        </svg>
        <h1 class="brand-title">Aura</h1>
      </div>
      <div id="userHeader" class="user-info hidden">
        <span id="userEmail"></span>
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </header>

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="auth-box">
      <h2>Welcome to Aura</h2>
      <p id="authSub">Enter your access credentials to continue.</p>
      <form class="auth-form" onsubmit="handleAuth(event)">
        <input type="text" id="emailInput" placeholder="Username / Email" required>
        <input type="password" id="passInput" placeholder="Password" required>
        <button type="submit">Continue to Chat</button>
      </form>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chatScreen" class="chat-view hidden">
      <div id="log">
        <div id="welcomePrompt" class="welcome-prompt">
          <h2>What can I do for you?</h2>
          <p>Try one of these, or type anything.</p>
          <div class="suggestions">
            <div class="chip" onclick="useSuggestion(this.innerText)">Kal subah 7 baje gym ka reminder set karo</div>
            <div class="chip" onclick="useSuggestion(this.innerText)">Save a note: Ask Priya about the venue booking</div>
            <div class="chip" onclick="useSuggestion(this.innerText)">Show my reminders</div>
          </div>
        </div>
      </div>

      <form class="input-bar" onsubmit="sendMessage(event)">
        <textarea id="userInput" placeholder="Type your message..." onkeydown="checkEnter(event)"></textarea>
        <button type="submit" class="send-btn">Send</button>
      </form>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('aura_token') || "";
    let currentUser = localStorage.getItem('aura_user') || "";

    if (token) {
      showChat(currentUser);
    }

    async function handleAuth(e) {
      e.preventDefault();
      const username = document.getElementById('emailInput').value;
      const password = document.getElementById('passInput').value;

      // Generates access token or stores auth info
      token = btoa(`${username}:${password}`);
      currentUser = username;

      localStorage.setItem('aura_token', token);
      localStorage.setItem('aura_user', currentUser);
      showChat(currentUser);
    }

    function showChat(email) {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('chatScreen').classList.remove('hidden');
      document.getElementById('userHeader').classList.remove('hidden');
      document.getElementById('userEmail').innerText = email;
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    function useSuggestion(text) {
      document.getElementById('userInput').value = text;
      sendMessage(new Event('submit'));
    }

    function checkEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(e);
      }
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      document.getElementById('welcomePrompt')?.remove();
      appendMsg(text, 'user');
      input.value = '';

      const pendingDiv = appendMsg('Aura is thinking...', 'aura pending');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ 
            message: text,
            prompt: text,
            user_id: currentUser
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          pendingDiv.innerText = errData.detail || 'Error processing request.';
          pendingDiv.classList.remove('pending');
          return;
        }

        const data = await res.json();
        pendingDiv.classList.remove('pending');
        pendingDiv.innerHTML = data.response || data.reply || data.message || JSON.stringify(data);
      } catch (err) {
        pendingDiv.innerText = 'Network error.';
        pendingDiv.classList.remove('pending');
      }
    }

    function appendMsg(text, type) {
      const log = document.getElementById('log');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
